@if (auth.currentUser(); as user) {
  <div class="user-profile-chip">
    <div class="user-avatar-badge">
      <span class="user-avatar-text">{{ user.name.charAt(0).toUpperCase() }}</span>
    </div>
    <span class="user-name">{{ user.name }}</span>
    <button class="btn-logout" (click)="logout()" [title]="'auth.logout' | translate">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </button>
  </div>
}
