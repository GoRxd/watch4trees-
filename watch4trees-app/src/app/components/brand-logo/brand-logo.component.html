<div 
  class="brand-logo" 
  [class.size-sm]="size === 'sm'" 
  [class.size-lg]="size === 'lg'"
  [class.is-clickable]="clickable"
  (click)="onClick()"
>
  <div class="logo-badge">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C12 2 4 8.5 4 15.5C4 19.6421 7.35786 23 11.5 23C12.1834 23 12.8462 22.9084 13.4757 22.7371C18.2573 21.4371 21 16.5 20 12C18.5 5.5 12 2 12 2Z" fill="url(#brandLeafGrad)"/>
      <path d="M12 7V21M12 11L8 14M12 15L16 12.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="brandLeafGrad" x1="4" y1="2" x2="20" y2="23" gradientUnits="userSpaceOnUse">
          <stop stop-color="#52B788"/>
          <stop offset="0.6" stop-color="#2D6A4F"/>
          <stop offset="1" stop-color="#1B4332"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="logo-text">
    <span class="title">Watch4<span class="text-sage">Trees</span></span>
    @if (showSubtitle) {
      <span class="subtitle">{{ subtitle || ('nav.brandSubtitle' | translate) }}</span>
    }
  </div>
</div>
