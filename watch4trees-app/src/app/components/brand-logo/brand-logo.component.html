<div 
  class="brand-logo" 
  [class.size-sm]="size === 'sm'" 
  [class.size-lg]="size === 'lg'"
  [class.is-clickable]="clickable"
  (click)="onClick()"
>
  <div class="logo-badge">
    <span class="logo-emoji">🌲</span>
  </div>
  <div class="logo-text">
    <span class="title">Watch4<span class="text-neon">Trees</span></span>
    @if (showSubtitle) {
      <span class="subtitle">{{ subtitle || ('nav.brandSubtitle' | translate) }}</span>
    }
  </div>
</div>
