<a
  class="inline-flex items-center gap-3 select-none"
  [class.cursor-pointer]="clickable"
  [class.logo-sm]="size === 'sm'"
  [class.logo-lg]="size === 'lg'"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  [attr.role]="clickable ? 'link' : null"
  [attr.tabindex]="clickable ? 0 : null"
  [attr.aria-label]="'Watch4Trees - ' + ('nav.brandSubtitle' | translate)"
>
  <span class="logo-badge flex shrink-0 items-center justify-center border
               border-[rgb(82_183_136/0.35)] bg-[rgb(45_106_79/0.25)] shadow-sm
               transition-all duration-300 [transition-timing-function:var(--ease-spring)]"
        [class.size-8]="size === 'sm'"
        [class.size-10]="size === 'md'"
        [class.size-12]="size === 'lg'"
        [class.rounded-sm]="size !== 'lg'"
        [class.rounded-md]="size === 'lg'">
    <svg class="block"
         [class.size-4]="size === 'sm'"
         [class.size-6]="size === 'md'"
         [class.size-7]="size === 'lg'"
         viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 2C12 2 4 8.5 4 15.5C4 19.6421 7.35786 23 11.5 23C12.1834 23 12.8462 22.9084 13.4757 22.7371C18.2573 21.4371 21 16.5 20 12C18.5 5.5 12 2 12 2Z" fill="url(#brandLeafGrad)"/>
      <path d="M12 7V21M12 11L8 14M12 15L16 12.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="brandLeafGrad" x1="4" y1="2" x2="20" y2="23" gradientUnits="userSpaceOnUse">
          <stop stop-color="#10b981"/>
          <stop offset="0.6" stop-color="#059669"/>
          <stop offset="1" stop-color="#064e3b"/>
        </linearGradient>
      </defs>
    </svg>
  </span>

  <span class="brand-wordmark block leading-none">
    <span class="block font-sans font-extrabold tracking-tight text-white"
          [class.text-base]="size === 'sm'"
          [class.text-xl]="size === 'md'"
          [class.text-2xl]="size === 'lg'">Watch4<span class="text-sage">Trees</span></span>
    @if (showSubtitle) {
      <span class="mt-1 block font-semibold uppercase tracking-[0.08em] text-ink-muted max-[640px]:hidden"
            [class.text-\[0\.58rem\]]="size === 'sm'"
            [class.text-\[0\.65rem\]]="size === 'md'"
            [class.text-xs]="size === 'lg'">{{ subtitle || ('nav.brandSubtitle' | translate) }}</span>
    }
  </span>
</a>
