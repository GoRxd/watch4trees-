<figure
  class="tree-stage-container relative flex flex-col gap-4"
  [class.size-lg]="size() === 'lg'"
  [class.size-md]="size() === 'md'"
  role="group"
  [attr.aria-label]="('common.treeStagePrefix' | translate) + ' ' + (stageKey() | translate)"
>
  <!-- Status label sits ABOVE the artwork so it never covers the tree -->
  <div
    class="tree-state-badge mx-auto w-fit whitespace-nowrap rounded-full border border-line bg-[rgb(13_23_18/0.72)] px-3 py-1.5 text-xs font-semibold text-ink-soft"
    [class.planted-success]="isFinished()"
  >
    @if (!isFinished()) {
      <span>{{ stageKey() | translate }}</span>
    } @else {
      <span class="inline-flex items-center gap-1.5 font-bold">
        <ng-icon name="ph:crown" size="14px" aria-hidden="true" />
        {{ matureKey() | translate }}
      </span>
    }
  </div>

  <!-- Stage Visual Stage with Layered SVG Art -->
  <div class="tree-visual-stage relative flex items-end justify-center overflow-hidden rounded-xl border border-line bg-[rgb(7_15_10/0.5)]">
    <div
      class="pointer-events-none absolute inset-0 animate-drop-pulse transition-opacity duration-500 [background:radial-gradient(ellipse_at_center,rgba(16,185,129,0.18)_0%,transparent_65%)]"
      [class.glow-celebrate]="isCelebration()"
      aria-hidden="true"
    ></div>

    <!-- Celebration burst: leaf/drop/star pieces fly out on planting -->
    @if (isCelebration()) {
      <div class="celebration-burst" aria-hidden="true">
        @for (piece of burstPieces; track $index) {
          <span class="burst-piece" [style]="piece.style">
            <ng-icon [name]="piece.icon" size="14px" />
          </span>
        }
      </div>
    }

    <!-- Animated Watering Can (Konewka) & Water Droplets Animation -->
    <div class="watering-can-container" [class.watering-active]="isWatering()">
      <div class="can-body-box">
        <svg class="can-svg block" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Can Body -->
          <path d="M64 28H34L40 70H68L64 28Z" fill="url(#canGrad1)" stroke="#34D399" stroke-width="1.8"/>
          <!-- Top Opening Rim -->
          <ellipse cx="49" cy="28" rx="15" ry="4" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
          <!-- Back Handle -->
          <path d="M65 34C82 34 84 58 68 62" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <!-- Top Handle -->
          <path d="M58 27V15C58 13 42 13 42 15V27" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" fill="none"/>
          <!-- Spout -->
          <path d="M42 48L20 26L16 31L39 56" fill="#059669" stroke="#34D399" stroke-width="1.5"/>
          <!-- Sprinkler Head -->
          <ellipse cx="17" cy="27" rx="5" ry="9" transform="rotate(-35 17 27)" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
          <circle cx="17" cy="25" r="0.9" fill="#064E3B"/>
          <circle cx="15" cy="28" r="0.9" fill="#064E3B"/>
          <circle cx="19" cy="29" r="0.9" fill="#064E3B"/>
          <defs>
            <linearGradient id="canGrad1" x1="68" y1="28" x2="34" y2="70" gradientUnits="userSpaceOnUse">
              <stop stop-color="#10B981"/>
              <stop offset="1" stop-color="#064E3B"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Water stream -->
      @if (isWatering()) {
        <div class="water-drops-shower" aria-hidden="true">
          <span class="water-stream-drop drop-1"></span>
          <span class="water-stream-drop drop-2"></span>
          <span class="water-stream-drop drop-3"></span>
        </div>
        <div class="soil-splash-effect" aria-hidden="true">
          <span class="splash-ring ring-1"></span>
          <span class="splash-ring ring-2"></span>
        </div>
      }
    </div>

    <!-- Organic SVG Botanical Artwork (bespoke brand art) -->
    <div
      class="stage-artwork relative z-2 animate-float pb-2 transition-transform duration-500 [transition-timing-function:var(--ease-spring)]"
      [class.celebrate-bounce]="isCelebration()"
    >
      @switch (stageIndex()) {
        @case (0) {
          <!-- Stage 0: Rich Acorn / Seed in Nutritious Earth -->
          <svg class="tree-svg-stage size-38 max-md:size-32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="132" rx="55" ry="14" fill="#0b140f" stroke="rgba(52,211,153,0.18)" stroke-width="1.5"/>
            <path d="M42 132C55 125 105 125 118 132" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M60 138C70 144 90 144 100 138" stroke="rgba(52,211,153,0.25)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M62 82C62 70 98 70 98 82C98 86 62 86 62 82Z" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
            <path d="M80 68V76" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M68 76L92 76" stroke="#78350F" stroke-width="1" stroke-dasharray="2 2"/>
            <path d="M63 84C63 108 80 120 80 120C80 120 97 108 97 84C97 82 63 82 63 84Z" fill="url(#seedGrad)"/>
            <path d="M80 72C80 58 88 52 96 50C96 58 90 66 80 72Z" fill="url(#sproutTipGrad)" stroke="#059669" stroke-width="1"/>
            <circle cx="94" cy="52" r="2.5" fill="#38BDF8" fill-opacity="0.9"/>
            <defs>
              <linearGradient id="seedGrad" x1="63" y1="84" x2="97" y2="120" gradientUnits="userSpaceOnUse">
                <stop stop-color="#F59E0B"/>
                <stop offset="0.7" stop-color="#B45309"/>
                <stop offset="1" stop-color="#78350F"/>
              </linearGradient>
              <linearGradient id="sproutTipGrad" x1="80" y1="50" x2="96" y2="72" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6EE7B7"/>
                <stop offset="1" stop-color="#10B981"/>
              </linearGradient>
            </defs>
          </svg>
        }
        @case (1) {
          <!-- Stage 1: Sprout with Dew Drops -->
          <svg class="tree-svg-stage size-38 max-md:size-32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="134" rx="58" ry="14" fill="#0b140f" stroke="rgba(52,211,153,0.2)" stroke-width="1.5"/>
            <path d="M80 134C80 110 76 90 80 62" stroke="#34D399" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M80 84C56 78 48 58 52 46C66 48 76 68 80 84Z" fill="url(#sproutL1)" stroke="#064E3B" stroke-width="1.2"/>
            <path d="M80 84C68 72 58 60 54 50" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M80 70C104 64 112 44 106 32C92 35 84 54 80 70Z" fill="url(#sproutL2)" stroke="#064E3B" stroke-width="1.2"/>
            <path d="M80 70C92 56 100 46 104 36" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="102" cy="40" r="4" fill="#38BDF8" fill-opacity="0.9"/>
            <circle cx="101" cy="38.5" r="1.5" fill="#FFFFFF"/>
            <defs>
              <linearGradient id="sproutL1" x1="48" y1="46" x2="80" y2="84" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6EE7B7"/>
                <stop offset="0.6" stop-color="#10B981"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
              <linearGradient id="sproutL2" x1="106" y1="32" x2="80" y2="70" gradientUnits="userSpaceOnUse">
                <stop stop-color="#A7F3D0"/>
                <stop offset="0.6" stop-color="#059669"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
            </defs>
          </svg>
        }
        @case (2) {
          <!-- Stage 2: Young Sapling -->
          <svg class="tree-svg-stage size-38 max-md:size-32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="136" rx="60" ry="14" fill="#0b140f" stroke="rgba(52,211,153,0.22)" stroke-width="1.5"/>
            <path d="M76 136L78 72L82 72L84 136Z" fill="#78350F"/>
            <path d="M78 88L62 76" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
            <path d="M82 82L98 70" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
            <circle cx="58" cy="68" r="22" fill="url(#sapGrad1)"/>
            <circle cx="102" cy="68" r="22" fill="url(#sapGrad2)"/>
            <circle cx="80" cy="46" r="28" fill="url(#sapGrad3)"/>
            <circle cx="80" cy="66" r="22" fill="url(#sapGrad4)"/>
            <path d="M70 42C74 36 86 36 90 42" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="sapGrad1" x1="36" y1="46" x2="80" y2="90" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34D399"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
              <linearGradient id="sapGrad2" x1="80" y1="46" x2="124" y2="90" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10B981"/>
                <stop offset="1" stop-color="#042F2E"/>
              </linearGradient>
              <linearGradient id="sapGrad3" x1="52" y1="18" x2="108" y2="74" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6EE7B7"/>
                <stop offset="0.7" stop-color="#059669"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
              <linearGradient id="sapGrad4" x1="58" y1="44" x2="102" y2="88" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10B981"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
            </defs>
          </svg>
        }
        @default {
          <!-- Stage 3: Majestic Certified European Oak -->
          <svg class="tree-svg-stage size-44 max-md:size-34" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="138" rx="66" ry="15" fill="#0b140f" stroke="rgba(52,211,153,0.3)" stroke-width="1.8"/>
            <path d="M66 138C72 130 74 95 75 66L85 66C86 95 88 130 94 138Z" fill="#582F0E"/>
            <path d="M70 138L77 128" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M90 138L83 128" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M75 88L52 74" stroke="#582F0E" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M85 82L108 68" stroke="#582F0E" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="72" r="28" fill="url(#oakGrad1)"/>
            <circle cx="110" cy="72" r="28" fill="url(#oakGrad2)"/>
            <circle cx="80" cy="42" r="36" fill="url(#oakGrad3)"/>
            <circle cx="80" cy="68" r="32" fill="url(#oakGrad4)"/>
            <path d="M66 38C72 32 88 32 94 38" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M42 66C48 60 58 60 62 66" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
            <path d="M98 66C104 60 114 60 118 66" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>

            <!-- Verified Impact Gold Seal Medal -->
            @if (isFinished()) {
              <g class="verified-seal-group">
                <circle cx="118" cy="38" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" filter="drop-shadow(0 2px 8px rgba(245,158,11,0.5))"/>
                <path d="M112 38L116 42L124 34" stroke="#050B07" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            }
            <defs>
              <linearGradient id="oakGrad1" x1="22" y1="44" x2="78" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34D399"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
              <linearGradient id="oakGrad2" x1="82" y1="44" x2="138" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10B981"/>
                <stop offset="1" stop-color="#022C22"/>
              </linearGradient>
              <linearGradient id="oakGrad3" x1="44" y1="6" x2="116" y2="78" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6EE7B7"/>
                <stop offset="0.6" stop-color="#059669"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
              <linearGradient id="oakGrad4" x1="48" y1="36" x2="112" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10B981"/>
                <stop offset="1" stop-color="#064E3B"/>
              </linearGradient>
            </defs>
          </svg>
        }
      }
    </div>
  </div>

  <!-- Water Drops Progress Bar -->
  @if (showProgressBar()) {
    <figcaption class="flex flex-col gap-2">
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs text-ink-muted">{{ effectiveProgressLabelKey() | translate }}</span>
        <strong class="inline-flex items-center gap-1 font-mono text-sm font-bold text-water tabular-nums">
          {{ currentDrops() }} / {{ maxDrops() }}
          <ng-icon name="ph:drop-duotone" class="size-3.5 shrink-0" aria-hidden="true" />
        </strong>
      </div>

      <div class="eco-progress-track" role="progressbar" [attr.aria-valuenow]="currentDrops()" [attr.aria-valuemin]="0" [attr.aria-valuemax]="maxDrops()">
        <div
          class="eco-progress-fill progress-shine"
          [style.width.%]="progressPercentage()"
          [class.progress-completed]="isFinished()"
        ></div>
      </div>

      @if (showHint()) {
        <p class="text-xs leading-relaxed text-ink-muted">{{ effectiveHintKey() | translate }}</p>
      }
    </figcaption>
  }
</figure>
