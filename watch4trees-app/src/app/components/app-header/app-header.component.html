<header class="app-top-bar" role="banner">
  <!-- Left Side: Brand Logo (Always clickable to return to dashboard) -->
  <div class="top-bar-left">
    <app-brand-logo 
      size="md" 
      [subtitle]="subtitle()" 
      [showSubtitle]="true"
      routeTarget="/dashboard"
    ></app-brand-logo>
  </div>

  <!-- Right Side: Desktop Controls, Mobile Compact HUD, Hamburger Button -->
  <div class="top-bar-right">
    <nav class="desktop-nav-items" [attr.aria-label]="'a11y.navApp' | translate">
      <app-user-hud mode="compact" [showStreak]="true"></app-user-hud>
      <app-lang-toggle></app-lang-toggle>
      <app-user-profile></app-user-profile>
    </nav>

    <!-- Mobile Compact HUD (Shown only on small screens) -->
    <div class="mobile-hud-compact">
      <app-user-hud mode="compact" [showStreak]="false"></app-user-hud>
    </div>

    <!-- Hamburger Toggle Button -->
    <button
      class="btn-hamburger"
      (click)="toggleMobileMenu()"
      [title]="'common.menu' | translate"
      [attr.aria-label]="'a11y.mobileMenu' | translate"
      [attr.aria-expanded]="isMobileMenuOpen()"
    >
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
    </button>
  </div>
</header>

<!-- Shared Mobile Drawer Component -->
<app-mobile-drawer
  [isOpen]="isMobileMenuOpen()"
  mode="app"
  (closeDrawer)="closeMobileMenu()"
></app-mobile-drawer>
